[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plaindaw"
version = "0.2.0"
description = "A plain-text, headless-first DAW that people and AI can both drive: JSON projects, one op layer, undo history, offline render, loudness analysis, VST3/CLAP hosting, CLI + JSON-RPC + MCP + browser GUI."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{ name = "Garyck Arntzen" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "mido>=1.3",
  "pedalboard>=0.9",
]

[project.optional-dependencies]
test = ["pytest>=7", "pyloudnorm>=0.1", "mcp>=1.0", "playwright>=1.40"]

[project.scripts]
plaindaw = "plaindaw.cli:main"
aidaw = "plaindaw.cli:main"

[project.urls]
Author = "https://x.com/_mintydoge"

[tool.setuptools.packages.find]
include = ["plaindaw*"]

[tool.setuptools.package-data]
plaindaw = ["gui/*", "kit_pins.json", "native/src/*.c", "native/third_party/clap-include/**/*", "schema/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long end-to-end runs (deselect with -m \"not slow\")"]
